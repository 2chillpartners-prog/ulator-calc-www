<!doctype html>
<html lang="en">
  <head>
    <title>ulator-Calc</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0D1B2A;
        color: #C8D6E5;
        line-height: 1.7;
        padding: 60px 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container { max-width: 560px; text-align: center; }
      h1 { font-size: 32px; color: #F5A623; margin-bottom: 12px; }
      p { font-size: 16px; margin-bottom: 24px; color: #C8D6E5; }
      .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
      a {
        color: #F5A623;
        text-decoration: none;
        padding: 10px 20px;
        border: 1px solid #F5A623;
        border-radius: 8px;
        font-size: 14px;
      }
      a:hover { background: #F5A623; color: #0D1B2A; }
      @media (prefers-color-scheme: light) {
        body { background: #fff; color: #333; }
        h1 { color: #0D1B2A; }
        a { color: #0D1B2A; border-color: #0D1B2A; }
        a:hover { background: #0D1B2A; color: #fff; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ulator-Calc</h1>
      <p>Multi-mode professional calculator with voice and AI assistance for the trades.</p>
      <div class="links">
        <a href="/ulator-calc/privacy">Privacy Policy</a>
        <a href="mailto:support@calc-pal.com">Support</a>
      </div>
    </div>
  </body>
</html>
